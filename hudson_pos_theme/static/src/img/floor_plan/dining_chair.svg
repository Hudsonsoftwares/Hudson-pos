<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- Top-view Restaurant Dining Chair -->
  <defs>
    <filter id="chairShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Backrest frame -->
  <path d="M 12 18 C 12 8, 48 8, 48 18 L 46 24 C 44 14, 16 14, 14 24 Z" fill="#4e342e" stroke="#2e1c14" stroke-width="1.5" filter="url(#chairShadow)"/>
  <!-- Padded seat cushion -->
  <rect x="13" y="18" width="34" height="32" rx="8" ry="8" fill="#a1887f" stroke="#5d4037" stroke-width="2"/>
  <!-- Inner leather cushion highlight -->
  <rect x="16" y="21" width="28" height="26" rx="6" ry="6" fill="#8d6e63" stroke="#4e342e" stroke-width="1"/>
  <!-- Stitching accents -->
  <line x1="20" y1="34" x2="40" y2="34" stroke="#6d4c41" stroke-width="1" stroke-dasharray="2,2"/>
</svg>
