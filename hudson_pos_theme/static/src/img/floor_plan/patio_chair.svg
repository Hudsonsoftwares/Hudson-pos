<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- Top-view Woven Rattan Patio Armchair -->
  <defs>
    <filter id="patioShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Curved woven back and armrests -->
  <path d="M 10 38 C 8 20, 14 10, 30 10 C 46 10, 52 20, 50 38 C 47 40, 44 38, 44 34 C 44 20, 40 16, 30 16 C 20 16, 16 20, 16 34 C 16 38, 13 40, 10 38 Z" fill="#8d6e63" stroke="#5d4037" stroke-width="1.5" filter="url(#patioShadow)"/>
  <!-- Armrest caps -->
  <circle cx="12" cy="38" r="3.5" fill="#a1887f" stroke="#5d4037" stroke-width="1"/>
  <circle cx="48" cy="38" r="3.5" fill="#a1887f" stroke="#5d4037" stroke-width="1"/>
  <!-- Wicker seat cushion -->
  <rect x="15" y="20" width="30" height="28" rx="8" ry="8" fill="#d7ccc8" stroke="#8d6e63" stroke-width="2"/>
  <rect x="18" y="23" width="24" height="22" rx="6" ry="6" fill="#c8a97e" stroke="#8d6e63" stroke-width="1"/>
</svg>
