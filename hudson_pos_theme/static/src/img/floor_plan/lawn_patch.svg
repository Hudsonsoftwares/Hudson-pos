<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110">
  <!-- Top-view Lush Lawn Grass Zone -->
  <defs>
    <filter id="lawnShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#33691e" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="5" y="5" width="150" height="100" rx="14" ry="14" fill="#9ccc65" fill-opacity="0.35" stroke="#689f38" stroke-width="2" filter="url(#lawnShadow)"/>
  <!-- Subtle lawn striping pattern -->
  <line x1="20" y1="25" x2="140" y2="25" stroke="#7cb342" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8,6"/>
  <line x1="20" y1="45" x2="140" y2="45" stroke="#7cb342" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8,6"/>
  <line x1="20" y1="65" x2="140" y2="65" stroke="#7cb342" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8,6"/>
  <line x1="20" y1="85" x2="140" y2="85" stroke="#7cb342" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8,6"/>
</svg>
