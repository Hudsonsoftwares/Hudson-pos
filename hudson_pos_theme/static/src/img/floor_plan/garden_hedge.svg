<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="160" height="50">
  <!-- Top-view Boxwood Green Garden Hedge Divider -->
  <defs>
    <filter id="hedgeShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1b5e20" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Main hedge body -->
  <rect x="6" y="8" width="148" height="34" rx="14" ry="14" fill="#33691e" stroke="#1b5e20" stroke-width="2" filter="url(#hedgeShadow)"/>
  <rect x="10" y="11" width="140" height="28" rx="12" ry="12" fill="#558b2f"/>
  <rect x="14" y="14" width="132" height="22" rx="10" ry="10" fill="#689f38"/>
  <!-- Leafy foliage bunches -->
  <circle cx="26" cy="22" r="8" fill="#7cb342" opacity="0.9"/>
  <circle cx="48" cy="26" r="9" fill="#8bc34a" opacity="0.85"/>
  <circle cx="70" cy="20" r="8.5" fill="#7cb342" opacity="0.9"/>
  <circle cx="92" cy="27" r="9.5" fill="#8bc34a" opacity="0.85"/>
  <circle cx="114" cy="21" r="8.5" fill="#7cb342" opacity="0.9"/>
  <circle cx="134" cy="25" r="8" fill="#8bc34a" opacity="0.85"/>
  <!-- Highlights -->
  <circle cx="38" cy="18" r="5" fill="#aed581" opacity="0.7"/>
  <circle cx="82" cy="18" r="5.5" fill="#aed581" opacity="0.7"/>
  <circle cx="124" cy="18" r="5" fill="#aed581" opacity="0.7"/>
</svg>
