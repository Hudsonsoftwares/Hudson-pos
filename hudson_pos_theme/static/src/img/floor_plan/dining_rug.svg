<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110">
  <!-- Top-view Elegant Dining Area Rug -->
  <defs>
    <filter id="rugShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Outer border -->
  <rect x="5" y="5" width="150" height="100" rx="10" ry="10" fill="#b5651d" fill-opacity="0.25" stroke="#b5651d" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#rugShadow)"/>
  <!-- Inner inlay -->
  <rect x="14" y="14" width="132" height="82" rx="6" ry="6" fill="#d7ccc8" fill-opacity="0.3" stroke="#8d6e63" stroke-width="1.5"/>
  <!-- Center medallion -->
  <ellipse cx="80" cy="55" rx="35" ry="20" fill="#efebe9" fill-opacity="0.5" stroke="#b5651d" stroke-width="1.5"/>
  <!-- Corner corner accents -->
  <circle cx="24" cy="24" r="4" fill="#b5651d" opacity="0.6"/>
  <circle cx="136" cy="24" r="4" fill="#b5651d" opacity="0.6"/>
  <circle cx="24" cy="86" r="4" fill="#b5651d" opacity="0.6"/>
  <circle cx="136" cy="86" r="4" fill="#b5651d" opacity="0.6"/>
</svg>
