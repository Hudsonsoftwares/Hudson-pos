<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <!-- Top-view Round Padded Bar Stool -->
  <defs>
    <filter id="stoolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Outer metallic / brass ring -->
  <circle cx="25" cy="25" r="22" fill="#c9a227" stroke="#8d6e63" stroke-width="1.5" filter="url(#stoolShadow)"/>
  <!-- Dark leather rim -->
  <circle cx="25" cy="25" r="19" fill="#2e1c14" stroke="#1b0000" stroke-width="1"/>
  <!-- Cushioned leather top -->
  <circle cx="25" cy="25" r="16" fill="#3e2723"/>
  <!-- Center button tuft & stitching -->
  <circle cx="25" cy="25" r="3" fill="#1b0000" stroke="#c9a227" stroke-width="1"/>
  <circle cx="25" cy="25" r="11" fill="none" stroke="#5d4037" stroke-width="1" stroke-dasharray="2,2"/>
</svg>
